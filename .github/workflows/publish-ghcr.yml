name: Publish container image

on:
  schedule:
    # Daily at 03:00 UTC. The check-for-new-commits job skips the build
    # entirely when master hasn't moved since the last successful publish,
    # so this doesn't spend runner minutes on unchanged code.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: publish-ghcr-master
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.compare.outputs.has_new_commits }}
    steps:
      - name: Compare master against the last successful publish
        id: compare
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "publish-ghcr.yml",
              status: "success",
              per_page: 1,
            });
            const { data: master } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "master",
            });
            const lastBuiltSha = runs.workflow_runs[0]?.head_sha;
            const hasNewCommits = lastBuiltSha !== master.commit.sha;
            core.info(
              `master is at ${master.commit.sha}; last successful publish built ${lastBuiltSha ?? "(none)"}`,
            );
            core.setOutput("has_new_commits", hasNewCommits);

  publish:
    needs: check
    if: needs.check.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps
          file: apps/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
