name: Publish container image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-master
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps
          file: apps/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retain three newest image versions
        uses: actions/github-script@v7
        env:
          PACKAGE_NAME: ${{ github.event.repository.name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packageName = process.env.PACKAGE_NAME.toLowerCase();
            const listParameters = {
              package_type: "container",
              package_name: packageName,
              per_page: 100,
            };
            const packageApi =
              context.payload.repository.owner.type === "Organization"
                ? {
                    list: github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg,
                    remove: github.rest.packages.deletePackageVersionForOrg,
                    owner: "org",
                  }
                : {
                    list: github.rest.packages.getAllPackageVersionsForPackageOwnedByUser,
                    remove: github.rest.packages.deletePackageVersionForUser,
                    owner: "username",
                  };
            const versions = await github.paginate(packageApi.list, {
                    ...listParameters,
              [packageApi.owner]: context.repo.owner,
            });

            versions.sort(
              (left, right) =>
                new Date(right.created_at).getTime() - new Date(left.created_at).getTime(),
            );
            for (const version of versions.slice(3)) {
              await packageApi.remove({
                package_type: "container",
                package_name: packageName,
                [packageApi.owner]: context.repo.owner,
                package_version_id: version.id,
              });
              core.info(`Deleted image version ${version.id}`);
            }
